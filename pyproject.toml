[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyrust"
version = "0.1.0"
description = "A tiny Python-like interpreter implemented in Rust"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ChanyaVRC" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: Other",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/ChanyaVRC/pyrust"
Repository = "https://github.com/ChanyaVRC/pyrust"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/pyrust/Cargo.toml"
strip = true
