[workspace]
members = ["crates/pyrust", "crates/pyrust-core", "crates/pyrust-builtins", "crates/pyrust-derive"]
resolver = "2"

[profile.release]
# thin LTO + single codegen unit: lets LLVM see across crate boundaries and
# inline Value::int/as_int, int_int_fast, and other hot-path helpers from
# pyrust-core / pyrust-builtins into the VM's main dispatch loop.
lto = "thin"
codegen-units = 1

# Profiling profile: identical codegen to `release` (same LTO / codegen-units,
# so the hot paths inline exactly as they ship), plus full DWARF debug info and
# no symbol stripping so `perf` / `valgrind` / flamegraphs can attribute samples
# to real function names and source lines. Build with `cargo build --profile
# profiling` (binary lands in target/profiling/), or use `tools/profile.sh`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
