[package]
name = "pyrust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pyrust"
path = "src/main.rs"

[dependencies]
bzip2 = "0.6.1"
getrandom = "0.2"
indexmap = "2"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
rustc-hash = "2"
num-bigint = "0.4"
num-traits = "0.2"
rustyline = "14"
smallvec = "1"
stacker = "0.1.24"
unicode_names2 = "2.0.0"
rusqlite = { version = "0.38", default-features = false, features = [
    "bundled",
    "functions",
    "backup",
    "blob",
    "collation",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
rustls-pemfile = "2.2"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
x509-parser = "0.18"
pyrust-core = { path = "../pyrust-core" }
pyrust-builtins = { path = "../pyrust-builtins" }
pyrust-derive = { path = "../pyrust-derive" }

# `os.getppid` calls the platform primitive directly (std has no portable API).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
