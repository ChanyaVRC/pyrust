[package]
name = "pyrust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pyrust"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
indexmap = "2"
num-bigint = "0.4"
num-traits = "0.2"
rustyline = "14"
smallvec = "1"
unicode_names2 = "2.0.0"
pyrust-core = { path = "../pyrust-core" }
pyrust-builtins = { path = "../pyrust-builtins" }
pyrust-derive = { path = "../pyrust-derive" }

# `os.getppid` calls the platform primitive directly (std has no portable API).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }
