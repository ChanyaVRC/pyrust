name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bypass-method-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `Value::truthy()` / `Value::repr()` are *bypass* methods that skip
      # `__bool__` / `__repr__` dispatch; they were renamed to `truthy_raw()` /
      # `repr_raw()` so interpreter-layer code can't reach them by accident
      # (issue #434). Guard against the bare names creeping back into
      # `pyrust_module!` body files, which must dispatch user dunders.
      - name: Forbid bypass methods in module bodies
        run: |
          if grep -rnE '\.(truthy|repr)\(\)' crates/pyrust/src/builtin_modules/bodies/; then
            echo "::error::Found bypass .truthy()/.repr() in a pyrust_module! body."
            echo "Use Interpreter::truthy_value / the repr() builtin (dunder-aware),"
            echo "or the explicit Value::truthy_raw()/repr_raw() if dispatch is genuinely unwanted."
            exit 1
          fi

  unit_and_integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Build
        run: cargo build --verbose

      - name: Run unit and integration tests
        run: cargo test --verbose

  parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Build
        run: cargo build --verbose

      - name: Run Python parity test
        run: cargo test --test parity_compare --verbose
