name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

  unit_and_integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build --verbose

      - name: Run unit and integration tests
        run: cargo test --verbose

  parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build --verbose

      - name: Run Python parity test
        run: cargo test --test parity_compare --verbose

  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PR binary
        run: cargo build --verbose

      - name: Build base binary for comparison
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/pyrust-base ${{ github.event.pull_request.base.sha }}
          cargo build --manifest-path /tmp/pyrust-base/Cargo.toml --target-dir /tmp/pyrust-base/target
          echo "BASE_PYRUST_BIN=/tmp/pyrust-base/target/debug/pyrust" >> "$GITHUB_ENV"

      - name: Benchmark speed (Python vs PyRust)
        run: |
          BASE_ARG=""
          if [ -n "$BASE_PYRUST_BIN" ]; then
            BASE_ARG="--base-bin $BASE_PYRUST_BIN"
          fi
          python tools/benchmark_compare.py --iterations 2 --top 12 $BASE_ARG
