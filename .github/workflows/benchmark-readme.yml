name: Benchmark Image Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  build_pages_artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PyRust
        run: cargo build --verbose

      - name: Set benchmark timestamp
        run: echo "BENCHMARK_TIMESTAMP_UTC=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Run benchmark and export snapshot
        run: |
          python tools/benchmark_compare.py \
            --iterations 10 --top 12 \
            --svg-out benchmark.svg \
            --json-out benchmark-snapshot.json

      - name: Fetch benchmark history
        run: |
          if git fetch origin benchmark-data; then
            git worktree add /tmp/bench-data benchmark-data
          else
            # First run: create orphan branch
            git worktree add --no-checkout /tmp/bench-data
            cd /tmp/bench-data
            git checkout --orphan benchmark-data
            git rm -rf . 2>/dev/null || true
            echo '[]' > history.json
            git add history.json
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                commit -m "init: benchmark-data branch"
            git push origin benchmark-data
          fi

      - name: Build pages with updated history
        run: |
          mkdir -p dist
          python tools/build_benchmark_pages.py \
            --snapshot benchmark-snapshot.json \
            --history /tmp/bench-data/history.json \
            --svg benchmark.svg \
            --out-html dist/index.html \
            --max-entries 200
          cp benchmark.svg dist/benchmark.svg

      - name: Push updated history to benchmark-data branch
        run: |
          cd /tmp/bench-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add history.json
          git diff --cached --quiet || \
            git commit -m "benchmark: ${GITHUB_SHA::12} $(date -u +'%Y-%m-%d')"
          git push origin benchmark-data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy_pages:
    needs: build_pages_artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
