name: Benchmark Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build

      - name: Run benchmark
        run: |
          python tools/benchmark_compare.py \
            --iterations 10 --top 12 \
            --benchmark-action-out benchmark-output.json

      - name: Create benchmark-data branch if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches/benchmark-data \
            --silent 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref=refs/heads/benchmark-data \
            -f sha=$(git rev-parse HEAD)

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          alert-threshold: "130%"
          comment-on-alert: true
          summary-always: true

      - name: Checkout benchmark-data for Pages
        uses: actions/checkout@v4
        with:
          ref: benchmark-data
          path: bench-data

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Copy bench data into site
        run: cp -r bench-data/dev/bench _site/bench

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
