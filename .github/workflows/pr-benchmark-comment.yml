name: PR Benchmark Comment

on:
  pull_request:
    paths:
      # VM dispatch loop and expression evaluator — primary perf-sensitive paths
      - 'crates/pyrust/src/interpreter/runtime/vm.rs'
      - 'crates/pyrust/src/interpreter/runtime/expr.rs'
      - 'crates/pyrust/src/interpreter/runtime/calls.rs'
      - 'crates/pyrust/src/interpreter/runtime/fast_path.rs'
      # Compiler and optimizer — const-fold / algebraic-simplify affect tight loops
      - 'crates/pyrust/src/compiler.rs'
      - 'crates/pyrust/src/optimizer.rs'
      # Builtin dispatch tables and core value representation
      - 'crates/pyrust-builtins/src/**'
      - 'crates/pyrust-core/src/**'
      # Bench infrastructure itself — runner, config, report generator
      - 'tools/bench.sh'
      - 'tools/bench.toml'
      - 'tools/bench_report.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Build PR binary (release)
        run: cargo build --release

      - name: Build base binary (release)
        run: |
          git worktree add /tmp/pyrust-base ${{ github.event.pull_request.base.sha }}
          cargo build --release \
            --manifest-path /tmp/pyrust-base/Cargo.toml \
            --target-dir /tmp/pyrust-base/target

      - name: Run benchmark
        id: benchmark
        run: |
          bash tools/bench.sh \
            --release \
            --measure-memory \
            --top 15 \
            --base-bin /tmp/pyrust-base/target/release/pyrust \
            --pr-comment-out /tmp/benchmark_body.md \
            --pr-full-out /tmp/benchmark_full.md \
            --memory-comment-out /tmp/memory_body.md \
            --memory-full-out /tmp/memory_full.md

      - name: Upload full benchmark reports
        id: upload-reports
        # bench.sh writes partial reports before returning 1 for timeouts.
        # Keep the failing outcome, but still publish whatever it completed.
        if: ${{ always() && steps.benchmark.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            /tmp/benchmark_full.md
            /tmp/memory_full.md
          if-no-files-found: ignore

      - name: Build combined comment
        id: build-comment
        if: ${{ always() && steps.benchmark.outcome != 'skipped' }}
        env:
          REPORTS_URL: ${{ steps.upload-reports.outputs.artifact-url }}
        run: |
          {
            echo "<!-- pyrust-benchmark-comment -->"
            echo "## :bar_chart: Benchmark Results"
            echo ""
            if [[ -s /tmp/benchmark_body.md ]]; then
              cat /tmp/benchmark_body.md
            else
              echo "> [!WARNING]"
              echo "> The benchmark step failed before it produced any completed timing rows. See the failed step log for details."
            fi
            if [[ -s /tmp/memory_body.md ]]; then
              echo ""
              echo "---"
              echo ""
              echo "## :brain: Memory Usage"
              echo ""
              cat /tmp/memory_body.md
            fi
            echo ""
            if [[ -n "$REPORTS_URL" ]]; then
              echo ":paperclip: Showing the 15 slowest scripts. Full results for all completed scripts: [\`benchmark-reports\` artifact](${REPORTS_URL})."
            fi
          } > /tmp/benchmark_comment.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        if: ${{ always() && steps.build-comment.outcome == 'success' }}
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pyrust-benchmark-comment -->"

      - name: Create or update comment
        if: ${{ always() && steps.find-comment.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: /tmp/benchmark_comment.md
          edit-mode: replace
